<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c0709" />
      <stop offset="70%" stop-color="#0b080a" />
      <stop offset="100%" stop-color="#050304" />
    </radialGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b44" />
      <stop offset="50%" stop-color="#ff1e27" />
      <stop offset="100%" stop-color="#b80c14" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#ff1e27" stroke-width="6" stroke-opacity="0.4" />

  <!-- Outer Crosshair Target Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ff1e27" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#neonRed)" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="70" fill="#ff1e27" fill-opacity="0.15" stroke="#ff1e27" stroke-width="4" />
  <circle cx="256" cy="256" r="24" fill="url(#neonRed)" filter="url(#glow)" />

  <!-- Tactical Reticle Ticks -->
  <line x1="256" y1="46" x2="256" y2="106" stroke="url(#neonRed)" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="406" x2="256" y2="466" stroke="url(#neonRed)" stroke-width="8" stroke-linecap="round" />
  <line x1="46" y1="256" x2="106" y2="256" stroke="url(#neonRed)" stroke-width="8" stroke-linecap="round" />
  <line x1="406" y1="256" x2="466" y2="256" stroke="url(#neonRed)" stroke-width="8" stroke-linecap="round" />

  <!-- Corner Tactical Brackets -->
  <path d="M 120 160 L 120 120 L 160 120" fill="none" stroke="#ff3b44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 392 160 L 392 120 L 352 120" fill="none" stroke="#ff3b44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 120 352 L 120 392 L 160 392" fill="none" stroke="#ff3b44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 392 352 L 392 392 L 352 392" fill="none" stroke="#ff3b44" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Text 33 Badge -->
  <text x="256" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-style="italic" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">SENSI 33</text>
</svg>
